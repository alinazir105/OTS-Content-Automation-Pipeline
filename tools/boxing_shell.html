
<!-- BOXING MATCH FULLSCREEN -->
<div id="boxing-shell" class="boxing-shell" hidden aria-modal="true">
  <button type="button" class="boxing-close" id="boxingClose">✕ Exit</button>

  <div id="boxingIntro" class="boxing-intro">
    <div style="font-size:3rem;margin-bottom:8px;">🥊</div>
    <h3>Multiplication Boxing</h3>
    <p>You're in the ring! <span class="accent">Jab LEFT</span> or <span class="accent">jab RIGHT</span> to pick your answer. Win by landing more hits than your opponent.</p>
    <button type="button" class="boxing-launch-btn" id="boxingBtnCam">📷 Fight with camera</button>
    <div style="margin-top:12px;"><button type="button" class="boxing-launch-btn" id="boxingBtnTap" style="background:transparent;border:2px solid rgba(255,255,255,0.4);box-shadow:none;">👆 Tap only</button></div>
  </div>

  <div id="boxingArena" class="boxing-arena">
    <div class="boxing-hud-top">
      <div class="boxing-health-bar"><label>You</label><div class="boxing-health-track"><div class="boxing-health-fill you" id="boxingHealthYou"></div></div></div>
      <span class="boxing-round-badge" id="boxingRoundBadge">Round 1 / 8</span>
      <div class="boxing-health-bar" style="text-align:right;"><label>Opponent</label><div class="boxing-health-track"><div class="boxing-health-fill opp" id="boxingHealthOpp"></div></div></div>
    </div>
    <div class="boxing-ring" id="boxingRing">
      <div class="boxing-ring-floor"></div>
      <div class="boxing-ropes"></div>
      <div class="boxing-opponent" id="boxingOpponent">
        <div class="opp-head"></div>
        <div class="opp-body"></div>
        <div class="opp-gloves-row"><div class="opp-glove"></div><div class="opp-glove"></div></div>
      </div>
      <div class="boxing-question-panel">
        <div class="boxing-question-text" id="boxingQuestion">6 × 7 = ?</div>
        <div class="boxing-options-row">
          <button type="button" class="boxing-option left" id="boxingOptL"><small>← Jab left</small><span id="boxingValL">42</span></button>
          <button type="button" class="boxing-option right" id="boxingOptR"><small>Jab right →</small><span id="boxingValR">48</span></button>
        </div>
      </div>
      <p class="boxing-punch-hint" id="boxingPunchHint">Put hands up — calibrating…</p>
      <div class="boxing-player-gloves"><div class="boxing-p-glove" id="boxingPGloveL"></div><div class="boxing-p-glove" id="boxingPGloveR"></div></div>
      <div class="boxing-flash-msg" id="boxingFlash" role="status"></div>
    </div>
    <div class="boxing-cam-pip" id="boxingCamPip">
      <video id="boxingVideo" playsinline muted autoplay></video>
      <span class="boxing-cal" id="boxingCal">Hands up…</span>
    </div>
  </div>

  <div id="boxingEnd" class="boxing-end" style="display:none;">
    <div style="font-size:2.5rem;">🏆</div>
    <h3 id="boxingEndTitle">Victory!</h3>
    <p id="boxingEndStats"></p>
    <button type="button" class="boxing-launch-btn" id="boxingBtnAgain">🔄 Rematch</button>
  </div>
</div>
